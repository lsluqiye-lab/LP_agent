<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. 定义部分：高级渐变与滤镜 -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#0F172A" />
      <stop offset="100%" style="stop-color:#020617" />
    </linearGradient>
    <linearGradient id="brain-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#0EA5E9" />
      <stop offset="100%" style="stop-color:#2563EB" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#EF4444" />
      <stop offset="100%" style="stop-color:#991B1B" />
    </linearGradient>
    <linearGradient id="exec-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#10B981" />
      <stop offset="100%" style="stop-color:#065F46" />
    </linearGradient>
    
    <!-- 装饰性网格 -->
    <pattern id="terminal-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 2. 背景与装饰层 -->
  <rect width="1000" height="900" fill="url(#bg-grad)" rx="10"/>
  <rect width="1000" height="900" fill="url(#terminal-grid)" rx="10"/>
  <rect x="50" y="50" width="900" height="800" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="10,10" opacity="0.3"/>

  <!-- 3. WATCHDOG SHIELD (位于顶部，居中) -->
  <g transform="translate(500, 120)">
    <!-- 盾牌外形 -->
    <path d="M 0 -70 L 60 -50 L 60 20 C 60 60, 0 90, 0 90 C 0 90, -60 60, -60 20 L -60 -50 Z" fill="url(#shield-grad)" stroke="#fff" stroke-width="2" />
    <text x="0" y="10" fill="#fff" font-family="Verdana" font-size="14" text-anchor="middle" font-weight="bold">WATCHDOG</text>
    <text x="0" y="30" fill="rgba(255,255,255,0.8)" font-family="Verdana" font-size="9" text-anchor="middle">1min High-Freq Protection</text>
    
    <!-- 核心能力标注 -->
    <line x1="-60" y1="0" x2="-140" y2="0" stroke="#EF4444" stroke-width="1"/>
    <text x="-150" y="5" fill="#EF4444" font-family="Verdana" font-size="11" text-anchor="end" font-weight="bold">Hard Stop 8%</text>
    <line x1="60" y1="0" x2="140" y2="0" stroke="#EF4444" stroke-width="1"/>
    <text x="150" y="5" fill="#EF4444" font-family="Verdana" font-size="11" text-anchor="start" font-weight="bold">News Emergency</text>
  </g>

  <!-- 4. STRATEGIC BRAIN - CIO HUB (核心决策区，位于正中央) -->
  <g transform="translate(500, 450)">
    <!-- 装饰光圈 -->
    <circle r="180" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="10,10" opacity="0.5" />
    <circle r="150" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3" />
    
    <!-- CIO 大脑核心 -->
    <rect x="-100" y="-60" width="200" height="120" rx="10" fill="url(#brain-grad)" stroke="#fff" stroke-width="2" />
    <text x="0" y="-10" fill="#fff" font-family="Impact" font-size="40" text-anchor="middle" letter-spacing="2">CIO CORE</text>
    <text x="0" y="25" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">RE-ACT INTELLIGENCE</text>
    <text x="0" y="45" fill="rgba(255,255,255,0.8)" font-family="Verdana" font-size="10" text-anchor="middle" font-style="italic">Strategic Reasoning Hub v3.0</text>
    
    <!-- 专家连接线与槽位 (对称分布) -->
    <!-- 上：Alpha Scanner -->
    <path d="M 0 -60 L 0 -130" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="-100" y="-170" width="200" height="40" rx="5" fill="#1E293B" stroke="#0EA5E9" />
    <text x="0" y="-145" fill="#38BDF8" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">Alpha Scanner 选股雷达</text>
    
    <!-- 左：技术/量化分析 -->
    <path d="M -100 0 L -200 0" stroke="#0EA5E9" stroke-width="2" />
    <rect x="-420" y="-40" width="220" height="80" rx="5" fill="#1E293B" stroke="#0EA5E9" />
    <text x="-310" y="-15" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">TECHNICAL &amp; QUANT</text>
    <text x="-310" y="10" fill="#94A3B8" font-family="Verdana" font-size="10" text-anchor="middle">Stage 2 / VCP / Alpha158</text>
    
    <!-- 右：基本面/情绪分析 -->
    <path d="M 100 0 L 200 0" stroke="#0EA5E9" stroke-width="2" />
    <rect x="200" y="-40" width="220" height="80" rx="5" fill="#1E293B" stroke="#0EA5E9" />
    <text x="310" y="-15" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">FUNDAMENTAL &amp; SENTIMENT</text>
    <text x="310" y="10" fill="#94A3B8" font-family="Verdana" font-size="10" text-anchor="middle">PEG / Valuation / FOMO</text>
    
    <!-- 下：风险准入 -->
    <path d="M 0 60 L 0 130" stroke="#0EA5E9" stroke-width="2" />
    <rect x="-100" y="130" width="200" height="40" rx="5" fill="#1E293B" stroke="#0EA5E9" />
    <text x="0" y="155" fill="#38BDF8" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">Macro Risk Scoring</text>
  </g>

  <!-- 5. TACTICAL EXECUTION (位于底部，居中) -->
  <g transform="translate(500, 780)">
    <rect x="-400" y="-50" width="800" height="100" rx="15" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="0" y="-20" fill="#34D399" font-family="Verdana" font-size="14" text-anchor="middle" font-weight="bold" letter-spacing="3">TACTICAL EXECUTION ENGINE</text>
    
    <!-- 指令模块 -->
    <rect x="-350" y="10" width="200" height="40" rx="5" fill="#065F46" />
    <text x="-250" y="35" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">LIT Sniper (突破)</text>
    
    <rect x="-100" y="10" width="200" height="40" rx="5" fill="#065F46" />
    <text x="0" y="35" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">LO Support (低吸)</text>
    
    <rect x="150" y="10" width="200" height="40" rx="5" fill="#065F46" />
    <text x="250" y="35" fill="#fff" font-family="Verdana" font-size="12" text-anchor="middle" font-weight="bold">TSMPCT (止盈锁)</text>
  </g>

  <!-- 6. 核心闭环反馈 (Memory Loop) -->
  <path d="M 100 800 C 0 800, 0 450, 80 450" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="10,5" />
  <circle cx="85" cy="450" r="6" fill="#A855F7" />
  <text x="40" y="650" fill="#A855F7" font-family="Verdana" font-size="12" font-weight="bold" transform="rotate(-90 40 650)">MEMORY EVOLUTION</text>

  <!-- 7. 文字水印 -->
  <text x="950" y="870" fill="#334155" font-family="Arial Black" font-size="28" text-anchor="end" opacity="0.5">LP-AGENT CAPABILITIES V3.0</text>
</svg>

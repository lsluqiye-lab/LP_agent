<svg width="1000" height="750" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="grad-brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-watchdog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf360c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e64a19;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-execution" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-memory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 霓虹发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="750" fill="#0d1117" rx="15" />

  <!-- 层级 1: Watchdog (实时预警) -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <rect width="900" height="120" rx="10" fill="rgba(255,255,255,0.03)" stroke="#e64a19" stroke-width="1" stroke-dasharray="8,4" />
    <text x="20" y="30" fill="#e64a19" font-family="Arial" font-weight="bold" font-size="14">VIGILANCE LAYER [1min Watchdog Loop]</text>
    
    <rect x="300" y="50" width="180" height="40" rx="5" fill="url(#grad-watchdog)" filter="url(#glow)" />
    <text x="390" y="75" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Portfolio Guard</text>
    
    <path d="M480 70 L540 70" stroke="#e64a19" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)" />
    
    <rect x="540" y="50" width="180" height="40" rx="5" fill="url(#grad-watchdog)" filter="url(#glow)" />
    <text x="630" y="75" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Hard Stop (MO)</text>
  </g>

  <!-- 层级 2: Strategic Brain (深度决策) -->
  <g transform="translate(50, 200)" filter="url(#shadow)">
    <rect width="900" height="280" rx="10" fill="rgba(255,255,255,0.03)" stroke="#3949ab" stroke-width="1" />
    <text x="20" y="30" fill="#3949ab" font-family="Arial" font-weight="bold" font-size="14">STRATEGIC BRAIN [CIO & EXPERT ANALYSTS]</text>
    
    <!-- 专家面板 -->
    <rect x="40" y="60" width="160" height="40" rx="5" fill="#1a237e" stroke="#7986cb" />
    <text x="120" y="85" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Technical Expert</text>
    
    <rect x="40" y="110" width="160" height="40" rx="5" fill="#1a237e" stroke="#7986cb" />
    <text x="120" y="135" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Fundamental Expert</text>
    
    <rect x="40" y="160" width="160" height="40" rx="5" fill="#1a237e" stroke="#7986cb" />
    <text x="120" y="185" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Sentiment Expert</text>

    <path d="M200 125 L280 125" stroke="#7986cb" stroke-width="2" fill="none" />
    
    <!-- CIO 大脑 -->
    <rect x="280" y="85" width="240" height="120" rx="10" fill="url(#grad-brain)" filter="url(#glow)" />
    <text x="400" y="125" fill="#fff" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">CIO RE-ACT AGENT</text>
    <text x="400" y="150" fill="rgba(255,255,255,0.7)" font-family="Arial" font-size="11" text-anchor="middle">Dynamic Reasoning Path</text>
    <text x="400" y="175" fill="#81d4fa" font-family="Arial" font-size="10" text-anchor="middle" font-style="italic">"Bear-Case-First Philosphy"</text>
    
    <!-- 外部输入 -->
    <rect x="650" y="60" width="180" height="40" rx="5" fill="#0d47a1" stroke="#42a5f5" />
    <text x="740" y="85" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Macro Risk Scoring</text>
    
    <rect x="650" y="110" width="180" height="40" rx="5" fill="#0d47a1" stroke="#42a5f5" />
    <text x="740" y="135" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">Alpha Scanner选股</text>
    
    <path d="M650 80 L520 110" stroke="#42a5f5" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M650 130 L520 145" stroke="#42a5f5" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- 层级 3: Tactical Execution (精准执行) -->
  <g transform="translate(50, 500)" filter="url(#shadow)">
    <rect width="900" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="#388e3c" stroke-width="1" />
    <text x="20" y="30" fill="#388e3c" font-family="Arial" font-weight="bold" font-size="14">TACTICAL EXECUTION [LongPort OpenAPI]</text>
    
    <rect x="100" y="45" width="180" height="40" rx="5" fill="url(#grad-execution)" />
    <text x="190" y="70" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle">LIT (突破狙击)</text>
    
    <rect x="360" y="45" width="180" height="40" rx="5" fill="url(#grad-execution)" />
    <text x="450" y="70" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle">LO (支撑低吸)</text>
    
    <rect x="620" y="45" width="180" height="40" rx="5" fill="url(#grad-execution)" />
    <text x="710" y="70" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle">TSMPCT (追踪止盈)</text>
  </g>

  <!-- 层级 4: Evolution (记忆进化) -->
  <g transform="translate(50, 630)" filter="url(#shadow)">
    <rect width="900" height="100" rx="10" fill="rgba(255,255,255,0.05)" stroke="#7b1fa2" stroke-width="1" />
    <text x="20" y="25" fill="#7b1fa2" font-family="Arial" font-weight="bold" font-size="14">MEMORY & EVOLUTION</text>
    
    <rect x="350" y="40" width="300" height="45" rx="22" fill="url(#grad-memory)" filter="url(#glow)" />
    <text x="500" y="68" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Long-term Experience Engine</text>
    
    <!-- 闭环箭头 -->
    <path d="M350 62 C200 62, 100 400, 280 180" stroke="#ba68c8" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-purple)" />
    <text x="140" y="350" fill="#ba68c8" font-family="Arial" font-size="10" transform="rotate(-70 140 350)">Experience Feedback Loop</text>
  </g>

  <!-- 箭头标识定义 -->
  <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e64a19" />
  </marker>
  <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ba68c8" />
  </marker>
</svg>

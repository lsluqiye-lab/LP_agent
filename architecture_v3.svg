<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 滤镜：轻微投影增加立体感 -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#cbd5e1" flood-opacity="0.5"/>
    </filter>
    <!-- 箭头定义 -->
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
  </defs>

  <!-- 背景：干净的浅灰色 -->
  <rect width="1000" height="1000" fill="#f8fafc" rx="16" />

  <!-- 1. WATCHDOG LAYER (顶部：风险总闸) -->
  <rect x="150" y="40" width="700" height="120" rx="12" fill="#fff" stroke="#f1f5f9" stroke-width="1" filter="url(#soft-shadow)" />
  <rect x="150" y="40" width="700" height="40" rx="12" fill="#fff1f2" />
  <text x="500" y="67" fill="#e11d48" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" letter-spacing="1">🛡️ VIGILANCE LAYER: WATCHDOG 1MIN LOOP</text>
  
  <g transform="translate(250, 100)">
    <circle cx="0" cy="0" r="15" fill="#e11d48" />
    <text x="25" y="5" fill="#334155" font-family="Arial" font-size="14" font-weight="bold">生存级止损 (Hard Stop 8%)</text>
  </g>
  <g transform="translate(550, 100)">
    <circle cx="0" cy="0" r="15" fill="#e11d48" />
    <text x="25" y="5" fill="#334155" font-family="Arial" font-size="14" font-weight="bold">核弹新闻监测 (News Alert)</text>
  </g>

  <!-- 连线：Watchdog -> CIO -->
  <path d="M 500 160 L 500 220" stroke="#e11d48" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead-red)" />
  <text x="515" y="200" fill="#e11d48" font-family="Arial" font-size="12" font-style="italic">紧急干预权限</text>

  <!-- 2. STRATEGIC BRAIN (中间：深度决策) -->
  <rect x="100" y="240" width="800" height="480" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#soft-shadow)" />
  <text x="500" y="275" fill="#1e293b" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">🧠 STRATEGIC BRAIN: CIO CORE</text>

  <!-- CIO 核心决策盒 -->
  <rect x="350" y="420" width="300" height="120" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
  <text x="500" y="475" fill="#fff" font-family="Impact" font-size="36" text-anchor="middle">CIO DECISION</text>
  <text x="500" y="505" fill="#bfdbfe" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ReAct Reasoning Hub</text>

  <!-- 四大专家插槽 (严格对称) -->
  <!-- 左上：Alpha Scanner -->
  <rect x="130" y="320" width="200" height="60" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
  <text x="230" y="348" fill="#0369a1" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Alpha Scanner</text>
  <text x="230" y="365" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">动态选股 &amp; 信号发现</text>
  <path d="M 330 350 L 400 420" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-blue)" />

  <!-- 右上：Risk Scoring -->
  <rect x="670" y="320" width="200" height="60" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
  <text x="770" y="348" fill="#0369a1" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Macro Risk Score</text>
  <text x="770" y="365" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">宏观风控 &amp; 仓位管控</text>
  <path d="M 670 350 L 600 420" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-blue)" />

  <!-- 左下：Technical Expert -->
  <rect x="130" y="580" width="200" height="80" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
  <text x="230" y="610" fill="#0369a1" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Technical Expert</text>
  <text x="230" y="630" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">Stage 2 / VCP / RSI</text>
  <text x="230" y="645" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">Qlib Alpha158 量化因子</text>
  <path d="M 330 620 L 420 540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-blue)" />

  <!-- 右下：Fundamental Expert -->
  <rect x="670" y="580" width="200" height="80" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
  <text x="770" y="610" fill="#0369a1" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Strategic Expert</text>
  <text x="770" y="630" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">PEG / Valuation / News</text>
  <text x="770" y="645" fill="#64748b" font-family="Arial" font-size="10" text-anchor="middle">FOMO 情绪舆情探测器</text>
  <path d="M 670 620 L 580 540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead-blue)" />

  <!-- 3. EXECUTION LAYER (底部：战术执行) -->
  <path d="M 500 540 L 500 780" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowhead-blue)" />
  <text x="515" y="750" fill="#2563eb" font-family="Arial" font-size="12" font-weight="bold">下达战术指令</text>

  <rect x="150" y="780" width="700" height="140" rx="16" fill="#fff" stroke="#dcfce7" stroke-width="2" filter="url(#soft-shadow)" />
  <rect x="150" y="780" width="700" height="40" rx="16" fill="#f0fdf4" />
  <text x="500" y="807" fill="#16a34a" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">🎯 TACTICAL EXECUTION ENGINE (LongPort)</text>
  
  <g transform="translate(200, 840)">
    <rect width="180" height="50" rx="6" fill="#16a34a" />
    <text x="90" y="25" fill="#fff" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">LIT BREAKOUT</text>
    <text x="90" y="42" fill="#dcfce7" font-family="Arial" font-size="9" text-anchor="middle">突破狙击单</text>
  </g>
  <g transform="translate(410, 840)">
    <rect width="180" height="50" rx="6" fill="#16a34a" />
    <text x="90" y="25" fill="#fff" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">LO DIP BUYER</text>
    <text x="90" y="42" fill="#dcfce7" font-family="Arial" font-size="9" text-anchor="middle">支撑低吸单</text>
  </g>
  <g transform="translate(620, 840)">
    <rect width="180" height="50" rx="6" fill="#16a34a" />
    <text x="90" y="25" fill="#fff" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">TRAILING STOP</text>
    <text x="90" y="42" fill="#dcfce7" font-family="Arial" font-size="9" text-anchor="middle">动态追踪止盈</text>
  </g>

  <!-- 4. FEEDBACK LOOP (进化环) -->
  <path d="M 150 850 C -50 850, -50 480, 100 480" fill="none" stroke="#9333ea" stroke-width="3" stroke-dasharray="10,5" />
  <text x="40" y="700" fill="#9333ea" font-family="Arial" font-size="14" font-weight="bold" transform="rotate(-90 40 700)">经验闭环: 每日复盘与记忆进化</text>
  <circle cx="100" cy="480" r="6" fill="#9333ea" />

  <!-- 5. 商业水印 -->
  <text x="980" y="980" fill="#94a3b8" font-family="Arial Black" font-size="28" text-anchor="end" opacity="0.3">LP-AGENT v3.0 | Institutional Grade</text>
</svg>

<svg width="1000" height="920" viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 高级光效与渐变 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0" />
    </linearGradient>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- 1. 背景层：纯黑底色 + 极细网格 -->
  <rect width="1000" height="920" fill="#020617" rx="12" />
  <path d="M 0 460 L 1000 460 M 500 0 L 500 920" stroke="#1E293B" stroke-width="0.5" opacity="0.5" /> <!-- 中轴线参考 -->

  <!-- 2. WATCHDOG LAYER (最上方，绝对居中) -->
  <!-- 绘制盾牌 -->
  <path d="M 500 40 L 560 60 L 560 120 C 560 150, 500 180, 500 180 C 500 180, 440 150, 440 120 L 440 60 Z" fill="none" stroke="#F43F5E" stroke-width="2" filter="url(#glow)" />
  <text x="500" y="115" fill="#F43F5E" font-family="Verdana" font-size="16" text-anchor="middle" font-weight="bold">WATCHDOG</text>
  <text x="500" y="135" fill="#fff" font-family="Verdana" font-size="9" text-anchor="middle">1min High-Freq Protection</text>
  
  <!-- 功能标签 -->
  <rect x="300" y="80" width="100" height="25" rx="4" fill="#881337" opacity="0.6" />
  <text x="350" y="97" fill="#FDA4AF" font-family="Verdana" font-size="10" text-anchor="middle">Hard Stop 8%</text>
  <rect x="600" y="80" width="100" height="25" rx="4" fill="#881337" opacity="0.6" />
  <text x="650" y="97" fill="#FDA4AF" font-family="Verdana" font-size="10" text-anchor="middle">Crash Alert</text>

  <!-- 3. STRATEGIC BRAIN (正中央核心区) -->
  <!-- 连接线：从盾牌到大脑 -->
  <path d="M 500 180 L 500 300" stroke="#334155" stroke-width="1" stroke-dasharray="5,5" />

  <!-- CIO 中央核心 -->
  <rect x="380" y="380" width="240" height="140" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" />
  <text x="500" y="440" fill="#fff" font-family="Impact" font-size="42" text-anchor="middle" letter-spacing="3">AI CIO</text>
  <text x="500" y="470" fill="#38BDF8" font-family="Verdana" font-size="14" text-anchor="middle" font-weight="bold">ReAct Reasoning Core</text>
  <text x="500" y="490" fill="rgba(255,255,255,0.6)" font-family="Verdana" font-size="10" text-anchor="middle">Dual-Model Architecture v3.0</text>

  <!-- 专家组件：环绕式布局 (绝对对称) -->
  <!-- 左上：Alpha Scanner -->
  <rect x="150" y="300" width="180" height="50" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
  <text x="240" y="325" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle" font-weight="bold">Alpha Scanner</text>
  <text x="240" y="340" fill="#94A3B8" font-family="Verdana" font-size="9" text-anchor="middle">Dynamic Signal Finder</text>
  <path d="M 330 325 L 400 380" stroke="#334155" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- 右上：Risk Scoring -->
  <rect x="670" y="300" width="180" height="50" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
  <text x="760" y="325" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle" font-weight="bold">Macro Risk Scoring</text>
  <text x="760" y="340" fill="#94A3B8" font-family="Verdana" font-size="9" text-anchor="middle">Global Market Guard</text>
  <path d="M 670 325 L 600 380" stroke="#334155" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- 左中：Technical Analyst -->
  <rect x="50" y="425" width="220" height="60" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="160" y="450" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle" font-weight="bold">TECHNICAL EXPERT</text>
  <text x="160" y="468" fill="#94A3B8" font-family="Verdana" font-size="9" text-anchor="middle">Stage 2 / VCP / Qlib Alpha158</text>
  <path d="M 270 455 L 380 455" stroke="#38BDF8" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- 右中：Fundamental Analyst -->
  <rect x="730" y="425" width="220" height="60" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="840" y="450" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle" font-weight="bold">STRATEGIC ANALYST</text>
  <text x="840" y="468" fill="#94A3B8" font-family="Verdana" font-size="9" text-anchor="middle">PEG / Valuation / Sentiment</text>
  <path d="M 730 455 L 620 455" stroke="#38BDF8" stroke-width="1" marker-end="url(#arrowhead)" />

  <!-- 4. EXECUTION LAYER (下方，绝对居中) -->
  <path d="M 500 520 L 500 680" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  
  <rect x="150" y="700" width="700" height="120" rx="10" fill="none" stroke="#10B981" stroke-width="2" filter="url(#glow)" />
  <text x="500" y="730" fill="#10B981" font-family="Verdana" font-size="14" text-anchor="middle" font-weight="bold" letter-spacing="2">INSTITUTIONAL EXECUTION (LONGPORT)</text>
  
  <!-- 订单类型 -->
  <rect x="200" y="750" width="160" height="40" rx="5" fill="#064E3B" stroke="#10B981" />
  <text x="280" y="775" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle">LIT Breakout Sniper</text>
  
  <rect x="420" y="750" width="160" height="40" rx="5" fill="#064E3B" stroke="#10B981" />
  <text x="500" y="775" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle">LO Dip Buyer</text>
  
  <rect x="640" y="750" width="160" height="40" rx="5" fill="#064E3B" stroke="#10B981" />
  <text x="720" y="775" fill="#fff" font-family="Verdana" font-size="11" text-anchor="middle">Trailing Profit Lock</text>

  <!-- 5. FEEDBACK LOOP (左侧进化环) -->
  <path d="M 200 760 C 20 760, 20 450, 50 450" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="10,5" />
  <text x="40" y="650" fill="#A855F7" font-family="Verdana" font-size="12" font-weight="bold" transform="rotate(-90 40 650)">LEARNING LOOP</text>
  <circle cx="50" cy="450" r="5" fill="#A855F7" filter="url(#glow)" />

  <!-- 6. 水印与版本 -->
  <text x="980" y="900" fill="#1E293B" font-family="Arial Black" font-size="32" text-anchor="end" opacity="0.4">LP-AGENT CAPABILITIES V3.0</text>
</svg>

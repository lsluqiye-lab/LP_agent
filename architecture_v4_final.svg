    <!-- Deep Space Grid Background -->
    <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
      <path d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240 M 0,280 L 1000,280 M 0,320 L 1000,320 M 0,360 L 1000,360 M 0,400 L 1000,400 M 0,440 L 1000,440 M 0,480 L 1000,480 M 0,520 L 1000,520 M 0,560 L 1000,560 M 0,600 L 1000,600 M 0,640 L 1000,640 M 0,680 L 1000,680 M 0,720 L 1000,720" />
      <path d="M 100,0 L 100,780 M 200,0 L 200,780 M 300,0 L 300,780 M 400,0 L 400,780 M 500,0 L 500,780 M 600,0 L 600,780 M 700,0 L 700,780 M 800,0 L 800,780 M 900,0 L 900,780" />
    </g>

    <!-- Header Block -->
    <rect x="0" y="0" width="1000" height="60" fill="url(#title-grad)" />
    <text x="30" y="38" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="1.5">LP-AGENT v4.0 COGNITIVE TRADING TOPOLOGY</text>
    <rect x="760" y="16" width="210" height="28" rx="14" fill="#000000" fill-opacity="0.5" />
    <circle cx="778" cy="30" r="6" fill="#10B981" />
    <text x="792" y="34" fill="#34D399" font-size="11" font-weight="800">3D STEREOSCOPIC FLOW</text>

    <!-- ==================== FLOW CONNECTORS (THE WIRES) ==================== -->
    <g fill="none" stroke-linecap="round">
      <!-- Qlib -> PM Data Pipe -->
      <path d="M 150,150 L 150,220" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
      <text x="160" y="190" fill="#38BDF8" font-size="10" font-weight="700">Alpha List</text>
      
      <!-- PM -> PreScreen Ingestion -->
      <path d="M 150,300 L 150,360" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrow-gold)" />
      <text x="160" y="335" fill="#FBBF24" font-size="10" font-weight="700">Limits &amp; Rules</text>

      <!-- PreScreen -> Expert Matrix Trigger -->
      <path d="M 260,400 L 340,400" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrow-gold)" />
      <text x="268" y="392" fill="#FBBF24" font-size="10" font-weight="700">Active Signals</text>

      <!-- Expert Briefings -> CIO ReAct Brain -->
      <path d="M 590,400 L 670,400" stroke="#C084FC" stroke-width="3" marker-end="url(#arrow-blue)" />
      <text x="596" y="390" fill="#C084FC" font-size="10" font-weight="700">Expert Briefings</text>

      <!-- WebSocket Watchdog -> CIO Emergency Wakeup (Bézier Curve) -->
      <path d="M 595,115 C 690,115 765,150 765,270" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)" stroke-dasharray="6 4" />
      <text x="672" y="135" fill="#EF4444" font-size="10" font-weight="800">🚨 WS Emergency Ingestion</text>

      <!-- 1-Min Watchdog -> CIO Regular Poll Wakeup (Bézier Curve) -->
      <path d="M 595,215 C 660,215 725,230 745,270" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="6 4" />

      <!-- CIO Decision -> BaseTradingEngine Interface -->
      <path d="M 765,430 C 765,500 660,530 590,530" stroke="#C084FC" stroke-width="3" marker-end="url(#arrow-blue)" />
      <text x="670" y="495" fill="#C084FC" font-size="10" font-weight="700">Decoupled Order Msg</text>

      <!-- BaseTradingEngine -> PRR Guard (Loopback) -->
      <path d="M 180,520 Q 110,520 110,535 Q 110,550 180,550" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
      <text x="115" y="505" fill="#34D399" font-size="9" font-weight="700">PRR Hook</text>

      <!-- BaseTradingEngine -> Auto-Stop Aligner (Loopback) -->
      <path d="M 780,520 Q 850,520 850,535 Q 850,550 780,550" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
      <text x="795" y="505" fill="#34D399" font-size="9" font-weight="700">Align Stops</text>

      <!-- BaseTradingEngine -> LongPort Channel -->
      <path d="M 350,570 L 350,630" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-blue)" />
      <text x="360" y="605" fill="#C084FC" font-size="10" font-weight="700">Live API Execution</text>

      <!-- LongPort Execution -> Review Agent (Feedback Loop) -->
      <path d="M 450,670 C 650,670 875,650 875,200" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" stroke-dasharray="5 3" />
      <text x="675" y="660" fill="#34D399" font-size="10" font-weight="800">📊 Post-Market PnL Audit</text>

      <!-- Review Agent -> Memory Consolidation -->
      <path d="M 875,150 L 875,220" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-emerald)" />

      <!-- Memory Lessons Injection -> CIO Brain (Bézier Loop) -->
      <path d="M 875,290 L 875,320" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-blue)" />
      <text x="885" y="308" fill="#34D399" font-size="10" font-weight="700">Lessons</text>
    </g>


    <!-- ==================== STEREOSCOPIC NODES (THE CARDS) ==================== -->

    <!-- [PERCEPTION] Qlib Quant Engine -->
    <g filter="url(#shadow-premium)">
      <rect x="40" y="80" width="220" height="70" rx="10" fill="url(#card-grad)" stroke="url(#border-cyan)" stroke-width="1.5" />
      <rect x="52" y="90" width="20" height="20" rx="4" fill="#06B6D4" fill-opacity="0.2" />
      <text x="58" y="104" fill="#22D3EE" font-size="11" font-weight="900">Q</text>
      <text x="80" y="100" fill="#F8FAFC" font-size="12" font-weight="800">Qlib Quant Engine</text>
      <text x="80" y="116" fill="#64748B" font-size="9" font-weight="700">Alpha158 Factor Sorting</text>
      <text x="80" y="130" fill="#22D3EE" font-size="9" font-weight="700">Top-Down Stock Selection</text>
    </g>

    <!-- [PERCEPTION] WebSocket Watchdog -->

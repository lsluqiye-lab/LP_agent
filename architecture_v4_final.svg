      <rect x="40" y="360" width="220" height="80" rx="10" fill="url(#card-grad)" stroke="url(#border-gold)" stroke-width="1.5" />
      <rect x="52" y="372" width="20" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2" />
      <text x="58" y="386" fill="#FBBF24" font-size="11" font-weight="900">F</text>
      <text x="80" y="382" fill="#F8FAFC" font-size="12" font-weight="800">Local Pre-Screening</text>
      <text x="80" y="398" fill="#64748B" font-size="9" font-weight="700">Hard rules threshold gate</text>
      <text x="80" y="412" fill="#34D399" font-size="9" font-weight="700">Allows Auto-HOLD (0 Token)</text>
    </g>

    <!-- [DECISION] Parallel Expert Matrix -->
    <g filter="url(#shadow-premium)">
      <rect x="340" y="350" width="250" height="100" rx="10" fill="url(#card-grad)" stroke="url(#border-purple)" stroke-width="1.5" />
      <rect x="352" y="362" width="20" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="358" y="376" fill="#C084FC" font-size="11" font-weight="900">E</text>
      <text x="380" y="372" fill="#F8FAFC" font-size="12" font-weight="800">Expert Matrix (Sem=2)</text>
      <text x="380" y="390" fill="#94A3B8" font-size="9">Technical: Multitimeframe Quantity</text>
      <text x="380" y="404" fill="#94A3B8" font-size="9">Fundamental: PE/PEG &amp; SWT Analyst</text>
      <text x="380" y="418" fill="#94A3B8" font-size="9">Sentiment &amp; Quant Aligned Factors</text>
    </g>

    <!-- [DECISION] CIO ReAct Strategic Brain -->
    <g filter="url(#shadow-premium)">
      <rect x="670" y="320" width="280" height="110" rx="10" fill="url(#card-grad)" stroke="url(#border-red)" stroke-width="2" />
      <rect x="682" y="332" width="20" height="20" rx="4" fill="#EF4444" fill-opacity="0.2" />
      <text x="687" y="346" fill="#F87171" font-size="11" font-weight="900">C</text>
      <text x="710" y="342" fill="#F8FAFC" font-size="13" font-weight="900">CIO ReAct Strategic Brain</text>
      <text x="710" y="362" fill="#94A3B8" font-size="9.5" font-weight="700">Thought-Action-Observation decision loop</text>
      <text x="710" y="378" fill="#F87171" font-size="9" font-weight="700">Covered Call / Protective Put / Sizing</text>
      <rect x="710" y="394" width="220" height="22" rx="4" fill="#000000" fill-opacity="0.4" />
      <text x="720" y="408" fill="#38BDF8" font-size="9" font-weight="700">Active Wakeup &amp; Strategic Auto-Adjustment</text>
    </g>

    <!-- [ADAPTER] BaseTradingEngine Interface -->
    <g filter="url(#shadow-premium)">
      <rect x="180" y="490" width="600" height="80" rx="10" fill="url(#card-grad)" stroke="url(#border-purple)" stroke-width="1.8" />
      <rect x="192" y="502" width="20" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="198" y="516" fill="#C084FC" font-size="11" font-weight="900">I</text>
      <text x="220" y="512" fill="#F8FAFC" font-size="13" font-weight="800">BaseTradingEngine Core Interface</text>
      <text x="220" y="528" fill="#64748B" font-size="10" font-weight="700">100% decouple execution from strategic logic</text>
      <text x="220" y="544" fill="#A78BFA" font-size="9.5" font-weight="700">Covered Call Guard ── Cash-secured Put Lock ── Cancel-Before-Modify order lock</text>
    </g>


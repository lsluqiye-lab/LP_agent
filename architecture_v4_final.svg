      <rect x="40" y="220" width="220" height="80" rx="10" fill="url(#card-grad)" stroke="url(#border-gold)" stroke-width="1.5" />
      <rect x="52" y="232" width="20" height="20" rx="4" fill="#F59E0B" fill-opacity="0.2" />
      <text x="58" y="246" fill="#FBBF24" font-size="11" font-weight="900">R</text>
      <text x="80" y="242" fill="#F8FAFC" font-size="12" font-weight="800">Portfolio &amp; Risk Manager</text>
      <text x="80" y="258" fill="#64748B" font-size="9" font-weight="700">Linear macro risk scoring</text>
      <text x="80" y="272" fill="#FBBF24" font-size="9" font-weight="700">Adaptive single/sector caps</text>
    </g>

    <!-- [DECISION] Pre-Screening Filter -->

      <rect x="372" y="90" width="20" height="20" rx="4" fill="#06B6D4" fill-opacity="0.2" />
      <text x="377" y="104" fill="#22D3EE" font-size="11" font-weight="900">W</text>
      <text x="400" y="100" fill="#F8FAFC" font-size="12" font-weight="800">WebSocket Watchdog</text>
      <text x="400" y="116" fill="#64748B" font-size="9" font-weight="700">Millisecond push-driven monitor</text>
      <text x="400" y="130" fill="#EF4444" font-size="9" font-weight="700">8% Cost Stop &amp; High-Breakout</text>
    </g>


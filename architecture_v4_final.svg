    <!-- [HEALING] auto_align_trailing_stops -->
    <g filter="url(#shadow-premium)">
      <rect x="800" y="490" width="150" height="80" rx="10" fill="url(#layer-grad)" stroke="url(#border-emerald)" stroke-width="1.5" />
      <rect x="808" y="500" width="16" height="16" rx="3" fill="#10B981" fill-opacity="0.2" />
      <text x="813" y="512" fill="#34D399" font-size="9" font-weight="900">A</text>
      <text x="830" y="512" fill="#F8FAFC" font-size="11" font-weight="800">Auto Aligner</text>
      <text x="808" y="534" fill="#94A3B8" font-size="8">Stop-loss Qty Auto Healing</text>
      <text x="808" y="546" fill="#34D399" font-size="8" font-weight="700">Matches actual holdings</text>
      <text x="808" y="558" fill="#34D399" font-size="8" font-weight="700">against active stops</text>
    </g>

    <!-- [EXECUTION] LongPort Channel (Live Broker) -->
    <g filter="url(#shadow-premium)">
      <rect x="220" y="630" width="260" height="80" rx="10" fill="url(#card-grad)" stroke="url(#border-purple)" stroke-width="1.5" />
      <rect x="232" y="642" width="20" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" />

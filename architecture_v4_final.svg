<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 780" style="background:#090D1A; border-radius:16px; box-shadow:0 30px 60px rgba(0,0,0,0.6); font-family:'Inter', system-ui, sans-serif;">
    <defs>
      <!-- Premium Glassmorphic Card Gradient -->
      <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
        <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
      </linearGradient>
      
      <!-- Glow Gradients for Layer Borders -->
      <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8" />
        <stop offset="100%" stop-color="#0EA5E9" />
      </linearGradient>
      <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FBBF24" />
        <stop offset="100%" stop-color="#F59E0B" />
      </linearGradient>
      <linearGradient id="glow-red" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F87171" />
        <stop offset="100%" stop-color="#EF4444" />
      </linearGradient>
      <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#C084FC" />
        <stop offset="100%" stop-color="#8B5CF6" />
      </linearGradient>
      <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34D399" />
        <stop offset="100%" stop-color="#10B981" />
      </linearGradient>
      
      <!-- Core Title Banner Gradient -->
      <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1E3A8A" />
        <stop offset="50%" stop-color="#2563EB" />
        <stop offset="100%" stop-color="#1D4ED8" />
      </linearGradient>

      <!-- Drop Shadows -->
      <filter id="shadow-premium" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
      </filter>
      
      <!-- Marker Arrows -->
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
      </marker>
      <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
      </marker>
      <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FBBF24" />
      </marker>

    <g filter="url(#shadow-premium)">
      <rect x="40" y="490" width="120" height="80" rx="10" fill="url(#layer-grad)" stroke="url(#border-emerald)" stroke-width="1.5" />
      <rect x="48" y="500" width="16" height="16" rx="3" fill="#10B981" fill-opacity="0.2" />
      <text x="53" y="512" fill="#34D399" font-size="9" font-weight="900">P</text>
      <text x="70" y="512" fill="#F8FAFC" font-size="11" font-weight="800">PRR Lock</text>
      <text x="48" y="534" fill="#94A3B8" font-size="8">50% Profit Retention</text>
      <text x="48" y="546" fill="#34D399" font-size="8" font-weight="700">Tightens stops</text>
      <text x="48" y="558" fill="#34D399" font-size="8" font-weight="700">automatically</text>

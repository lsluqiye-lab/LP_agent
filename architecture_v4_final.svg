    <g filter="url(#shadow-premium)">
      <rect x="360" y="180" width="230" height="70" rx="10" fill="url(#card-grad)" stroke="url(#border-cyan)" stroke-width="1.2" />
      <rect x="372" y="190" width="20" height="20" rx="4" fill="#06B6D4" fill-opacity="0.2" />
      <text x="378" y="204" fill="#22D3EE" font-size="11" font-weight="900">C</text>
      <text x="400" y="200" fill="#F8FAFC" font-size="12" font-weight="800">1-Min Cron Watchdog</text>
      <text x="400" y="216" fill="#64748B" font-size="9" font-weight="700">Medium frequency polling check</text>
      <text x="400" y="230" fill="#22D3EE" font-size="9" font-weight="700">ATR-based Dynamic Stops</text>
    </g>


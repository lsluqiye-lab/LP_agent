      <text x="260" y="668" fill="#64748B" font-size="9" font-weight="700">High-fidelity execution adaptor</text>
      <text x="260" y="682" fill="#38BDF8" font-size="9" font-weight="700">1:100 OCC Options &amp; Slippage calculation</text>
    </g>

    <!-- [EXECUTION] uSMART Channel (Planned Broker) -->
    <g filter="url(#shadow-premium)">
      <rect x="500" y="630" width="260" height="80" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />
      <rect x="512" y="642" width="20" height="20" rx="4" fill="#334155" fill-opacity="0.4" />
      <text x="518" y="656" fill="#94A3B8" font-size="11" font-weight="900">U</text>
      <text x="540" y="652" fill="#94A3B8" font-size="13" font-weight="800">uSMART Broker Adaptor</text>
      <text x="540" y="668" fill="#64748B" font-size="9" font-weight="700">Alternative gateway support</text>
      <text x="540" y="682" fill="#94A3B8" font-size="9" font-weight="700">Planned Virtual Conditional Orders</text>
    </g>

    <!-- [MEMORY] ReviewAgent -->
    <g filter="url(#shadow-premium)">
      <rect x="740" y="80" width="210" height="70" rx="10" fill="url(#layer-grad)" stroke="url(#border-violet)" stroke-width="1.2" />
      <rect x="748" y="90" width="16" height="16" rx="3" fill="#6366F1" fill-opacity="0.2" />
      <text x="753" y="102" fill="#818CF8" font-size="9" font-weight="900">V</text>
      <text x="770" y="101" fill="#F8FAFC" font-size="11" font-weight="800">ReviewAgent (Phase 5)</text>
      <text x="748" y="122" fill="#64748B" font-size="8.5">Audit &amp; Post-market daily review</text>
      <text x="748" y="134" fill="#818CF8" font-size="8.5" font-weight="700">Extracts tactical rules dynamically</text>
    </g>

    <!-- [MEMORY] TradingMemory -->
    <g filter="url(#shadow-premium)">
      <rect x="740" y="210" width="210" height="80" rx="10" fill="url(#layer-grad)" stroke="url(#border-violet)" stroke-width="1.2" />
      <rect x="748" y="220" width="16" height="16" rx="3" fill="#6366F1" fill-opacity="0.2" />
      <text x="753" y="232" fill="#818CF8" font-size="9" font-weight="900">M</text>
      <text x="770" y="231" fill="#F8FAFC" font-size="11" font-weight="800">TradingMemory Engine</text>
      <text x="748" y="252" fill="#64748B" font-size="8.5">Long-term mind &amp; lesson database</text>
      <text x="748" y="264" fill="#34D399" font-size="8.5" font-weight="700">Generates next-day daily_watchlist</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" style="background:#0F172A; font-family:'Inter', 'PingFang SC', sans-serif;">
    <defs>
      <!-- Premium Gradients -->
      <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1E40AF" />
        <stop offset="100%" stop-color="#3B82F6" />
      </linearGradient>
      
      <linearGradient id="perception-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0EA5E9" />
        <stop offset="100%" stop-color="#0284C7" />
      </linearGradient>
      
      <linearGradient id="risk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>
      
      <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8B5CF6" />
        <stop offset="100%" stop-color="#7C3AED" />
      </linearGradient>
      
      <linearGradient id="execution-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981" />
        <stop offset="100%" stop-color="#059669" />
      </linearGradient>

      <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      </filter>

      <!-- Markers -->
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
      </marker>
    </defs>

    <!-- Background Grid -->
    <g stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4">
      <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600 M 0,700 L 1200,700 M 0,800 L 1200,800 M 0,900 L 1200,900" />
      <path d="M 100,0 L 100,1000 M 200,0 L 200,1000 M 300,0 L 300,1000 M 400,0 L 400,1000 M 500,0 L 500,1000 M 600,0 L 600,1000 M 700,0 L 700,1000 M 800,0 L 800,1000 M 900,0 L 900,1000 M 1000,0 L 1000,1000 M 1100,0 L 1100,1000" />
    </g>

    <!-- Header -->
    <rect x="0" y="0" width="1200" height="70" fill="url(#header-grad)" />
    <text x="40" y="45" fill="#FFFFFF" font-size="24" font-weight="900" letter-spacing="2">LP-AGENT v4.5.1 叙事博弈与多路径决策架构</text>
    <text x="950" y="42" fill="#DBEAFE" font-size="12" font-weight="700">SMA-ToT HYBRID ENGINE</text>

    <!-- ==================== TIER 1: PERCEPTION (INPUTS) ==================== -->
    <text x="40" y="110" fill="#38BDF8" font-size="14" font-weight="800">TIER 1: 信号感知层 (PERCEPTION LAYER)</text>
    
    <!-- NME -->
    <g transform="translate(100, 130)" filter="url(#card-shadow)">
      <rect width="220" height="90" rx="12" fill="#1E293B" stroke="#0EA5E9" stroke-width="2" />
      <text x="20" y="35" fill="#F8FAFC" font-size="15" font-weight="800">叙事量化引擎 (NME)</text>
      <text x="20" y="58" fill="#94A3B8" font-size="11">全网叙事密度探测</text>
      <text x="20" y="75" fill="#38BDF8" font-size="11" font-weight="700">感知情绪偏移 / 风险先兆</text>
    </g>

    <!-- Alpha Scanner -->
    <g transform="translate(350, 130)" filter="url(#card-shadow)">
      <rect width="220" height="90" rx="12" fill="#1E293B" stroke="#0EA5E9" stroke-width="2" />
      <text x="20" y="35" fill="#F8FAFC" font-size="15" font-weight="800">Qlib 多因子中台</text>
      <text x="20" y="58" fill="#94A3B8" font-size="11">Alpha158 机器选股</text>
      <text x="20" y="75" fill="#38BDF8" font-size="11" font-weight="700">筛选主线行业与强势龙头</text>
    </g>

    <!-- WebSocket Watchdog -->
    <g transform="translate(600, 130)" filter="url(#card-shadow)">
      <rect width="220" height="90" rx="12" fill="#1E293B" stroke="#F43F5E" stroke-width="2" />
      <text x="20" y="35" fill="#F8FAFC" font-size="15" font-weight="800">WebSocket 高频雷达</text>
      <text x="20" y="58" fill="#94A3B8" font-size="11">毫秒级长桥数据监听</text>
      <text x="20" y="75" fill="#F43F5E" font-size="11" font-weight="700">极速防守 / 突破抢筹</text>
    </g>

    <!-- 1-Min Watchdog -->
    <g transform="translate(850, 130)" filter="url(#card-shadow)">
      <rect width="220" height="90" rx="12" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5" />
      <text x="20" y="35" fill="#F8FAFC" font-size="15" font-weight="800">1分钟巡检器</text>
      <text x="20" y="58" fill="#94A3B8" font-size="11">中频 K线离场巡检</text>
      <text x="20" y="75" fill="#38BDF8" font-size="11" font-weight="700">动态宽容追踪止损 (ATR)</text>
    </g>

    <!-- ==================== TIER 2: RISK & ORCHESTRATION ==================== -->
    <text x="40" y="270" fill="#FBBF24" font-size="14" font-weight="800">TIER 2: 风控与统筹层 (RISK &amp; COORDINATION)</text>
    
    <!-- Macro Risk Manager -->
    <g transform="translate(100, 290)" filter="url(#card-shadow)">
      <rect width="320" height="80" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
      <text x="20" y="35" fill="#F8FAFC" font-size="16" font-weight="800">风控与仓位中枢</text>
      <text x="20" y="60" fill="#FBBF24" font-size="12">宏观评分连续插值 ── 自适应敞口控制</text>
    </g>

    <!-- Expert Orchestrator -->
    <g transform="translate(450, 290)" filter="url(#card-shadow)">
      <rect width="620" height="80" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="2" />
      <text x="20" y="35" fill="#F8FAFC" font-size="16" font-weight="800">Expert Orchestrator (并行投研专家矩阵)</text>
      <text x="20" y="60" fill="#94A3B8" font-size="12">技术(量价) | 基本面(PEG) | 舆情(Sentiment) | 叙事(NME) | 板块轮动</text>
    </g>

    <!-- ==================== TIER 3: THE BRAIN (STRATEGY) ==================== -->
    <text x="40" y="420" fill="#F43F5E" font-size="14" font-weight="800">TIER 3: 战略大脑 (STRATEGIC BRAIN)</text>
    
    <!-- CIO ToT Brain -->
    <g transform="translate(100, 440)" filter="url(#card-shadow)">
      <rect width="970" height="150" rx="16" fill="#1E293B" stroke="#F43F5E" stroke-width="3" />
      <rect x="0" y="0" width="970" height="45" rx="16" fill="#F43F5E" fill-opacity="0.1" />
      <text x="30" y="30" fill="#F87171" font-size="18" font-weight="900">CIO 战略主脑 - Tree-of-Thought (ToT) 深度博弈</text>
      
      <!-- Paths -->
      <g transform="translate(30, 65)">
        <rect width="280" height="60" rx="8" fill="#000000" fill-opacity="0.3" stroke="#34D399" stroke-width="1" />
        <text x="15" y="25" fill="#34D399" font-size="13" font-weight="800">[PATH: BULL]</text>
        <text x="15" y="45" fill="#94A3B8" font-size="11">支撑逻辑与叙事共振推演</text>
      </g>
      
      <g transform="translate(330, 65)">
        <rect width="280" height="60" rx="8" fill="#000000" fill-opacity="0.3" stroke="#FB7185" stroke-width="1" />
        <text x="15" y="25" fill="#FB7185" font-size="13" font-weight="800">[PATH: BEAR]</text>
        <text x="15" y="45" fill="#94A3B8" font-size="11">魔鬼代言人: 逻辑证伪与质疑</text>
      </g>
      
      <g transform="translate(630, 65)">
        <rect width="310" height="60" rx="8" fill="#000000" fill-opacity="0.3" stroke="#FBBF24" stroke-width="1" />
        <text x="15" y="25" fill="#FBBF24" font-size="13" font-weight="800">[PATH: SYNTHESIS]</text>
        <text x="15" y="45" fill="#94A3B8" font-size="11">博弈对撞: 合成最终胜率期望Action</text>
      </g>
    </g>

    <!-- ==================== TIER 4: EXECUTION (ADAPTERS) ==================== -->
    <text x="40" y="640" fill="#10B981" font-size="14" font-weight="800">TIER 4: 物理执行层 (EXECUTION LAYER)</text>
    
    <!-- BaseTradingEngine -->
    <g transform="translate(100, 660)" filter="url(#card-shadow)">
      <rect width="970" height="80" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2" />
      <text x="30" y="35" fill="#F8FAFC" font-size="16" font-weight="800">BaseTradingEngine 物理执行总线 (Broker Abstraction)</text>
      <text x="30" y="60" fill="#34D399" font-size="12">1:100 OCC 期权折算 | 滑点补偿 | Covered Call 校验 | 现金备兑校验 | TRADING_DRY_RUN 阻断</text>
    </g>

    <!-- Broker Adapters -->
    <g transform="translate(100, 760)" filter="url(#card-shadow)">
      <rect width="470" height="70" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
      <text x="25" y="30" fill="#F8FAFC" font-size="14" font-weight="800">LongPort Adaptor (Live)</text>
      <text x="25" y="52" fill="#94A3B8" font-size="11">OpenAPI 全品种交易对接</text>
    </g>
    
    <g transform="translate(600, 760)" filter="url(#card-shadow)" opacity="0.6">
      <rect width="470" height="70" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
      <text x="25" y="30" fill="#94A3B8" font-size="14" font-weight="800">uSMART Adaptor (Planned)</text>
      <text x="25" y="52" fill="#64748B" font-size="11">Virtual Advanced Orders (LIT/TSLP) implementation</text>
    </g>

    <!-- ==================== TIER 5: LEARNING (FEEDBACK) ==================== -->
    <text x="40" y="880" fill="#818CF8" font-size="14" font-weight="800">TIER 5: 进化与反馈层 (LEARNING LOOP)</text>
    
    <g transform="translate(100, 900)" filter="url(#card-shadow)">
      <rect width="470" height="70" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="2" />
      <text x="25" y="30" fill="#F8FAFC" font-size="14" font-weight="800">Review Agent (复盘审计)</text>
      <text x="25" y="52" fill="#94A3B8" font-size="11">打脸率 (Whipsaw) 检测 | 交易摩擦审计 | 策略自愈修正</text>
    </g>

    <g transform="translate(600, 900)" filter="url(#card-shadow)">
      <rect width="470" height="70" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2" />
      <text x="25" y="30" fill="#F8FAFC" font-size="14" font-weight="800">Trading Memory (长期记忆)</text>
      <text x="25" y="52" fill="#94A3B8" font-size="11">教训入库沉淀 | learned_rules 自动化注入决策链</text>
    </g>

    <!-- Connections (Simplified Clean Lines) -->
    <g stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <!-- Tier 1 to Tier 2 -->
      <path d="M 210,220 L 210,290" />
      <path d="M 460,220 L 460,290" />
      <path d="M 710,220 L 710,290" />
      <path d="M 960,220 L 960,290" />
      
      <!-- Tier 2 to Tier 3 -->
      <path d="M 260,370 L 260,440" />
      <path d="M 760,370 L 760,440" />
      
      <!-- Tier 3 to Tier 4 -->
      <path d="M 585,590 L 585,660" />
      
      <!-- Tier 4 to Adapters -->
      <path d="M 335,740 L 335,760" />
      <path d="M 835,740 L 835,760" />
      
      <!-- Execution to Review -->
      <path d="M 335,830 L 335,900" />
      
      <!-- Review to Memory -->
      <path d="M 570,935 L 600,935" />
    </g>

</svg>
